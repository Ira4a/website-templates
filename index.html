<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPR IAN — Art Deco Experience</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    /* === RESET & VARIABLES === */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    :root {
      --bg-color: #0B0C10;
      --card-bg: #14161D;
      --gold-main: #D4AF37;
      --gold-light: #F3E5AB;
      --text-color: #E5E5E5;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      height: 100vh;
    }

    /* === ART DECO BORDERS & BACKGROUND === */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      border: 12px solid var(--gold-main);
      outline: 2px solid var(--bg-color);
      outline-offset: -8px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 4rem;
      letter-spacing: 6px;
      color: var(--gold-light);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
      margin-bottom: 10px;
    }

    p.subtitle {
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold-main);
    }

    /* === RIGHT HOVER TRIGGER AREA === */
    .hover-trigger-zone {
      position: fixed;
      right: 0;
      top: 0;
      width: 80px;
      height: 100vh;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    /* === ART DECO SIDE MENU === */
    .side-menu {
      position: fixed;
      right: -100px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 101;
      padding: 20px 10px;
    }

    /* Reveal menu when hovering right edge or menu itself */
    .hover-trigger-zone:hover .side-menu,
    .side-menu:hover {
      right: 20px;
    }

    /* Circular Art Deco Buttons */
    .menu-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 2px solid var(--gold-main);
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0,0,0,0.8), inset 0 0 8px rgba(212, 175, 55, 0.2);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .menu-btn:hover {
      background: var(--gold-main);
      color: var(--bg-color);
      transform: scale(1.15) rotate(45deg);
      box-shadow: 0 0 20px var(--gold-main);
    }

    .menu-btn span {
      transition: transform 0.3s ease;
    }
    
    .menu-btn:hover span {
      transform: rotate(-45deg); /* Counter-rotate text so it stays upright */
    }

    /* === MINI-PAGE MODAL (PAGE-IN-PAGE) === */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-card {
      background: var(--card-bg);
      width: 70%;
      max-width: 800px;
      height: 70vh;
      border: 2px solid var(--gold-main);
      padding: 40px;
      position: relative;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.4s ease-out;
    }

    /* Inner Art Deco Frame for Modal */
    .modal-card::before {
      content: '';
      position: absolute;
      top: 8px; left: 8px; right: 8px; bottom: 8px;
      border: 1px solid var(--gold-main);
      pointer-events: none;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: var(--gold-main);
      font-size: 1.5rem;
      cursor: pointer;
      font-family: 'Cinzel', serif;
    }

    .modal-body h2 {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      margin-bottom: 20px;
      letter-spacing: 2px;
      border-bottom: 1px solid var(--gold-main);
      padding-bottom: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Main Hero Section -->
  <section class="hero">
    <h1>DPR IAN</h1>
    <p class="subtitle">Christian Yu — Visuals & Sound</p>
    <p style="margin-top: 20px; color: #888; font-size: 0.9rem;">( Move cursor to the right edge to reveal the menu )</p>
  </section>

  <!-- Trigger Zone & Side Menu -->
  <div class="hover-trigger-zone">
    <nav class="side-menu">
      <button class="menu-btn" onclick="openModal('about')"><span>BIO</span></button>
      <button class="menu-btn" onclick="openModal('music')"><span>MUSIC</span></button>
      <button class="menu-btn" onclick="openModal('videos')"><span>FILMS</span></button>
      <button class="menu-btn" onclick="openModal('contact')"><span>INFO</span></button>
    </nav>
  </div>

  <!-- Page-in-Page Modal Window -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div class="modal-body" id="modalContent">
        <!-- Content will be injected dynamically -->
      </div>
    </div>
  </div>

  <script>
    const contentData = {
      about: `
        <h2>01. BIOGRAPHY</h2>
        <p>Christian Yu, professionally known as <strong>DPR IAN</strong>, is an Australian singer, director, and chief editor based in South Korea. He is a co-founder of the multi-genre music and video collective <em>Dream Perfect Regime (DPR)</em>.</p>
        <p style="margin-top: 15px;">Known for creating immersive visual worlds, his work blends dark fantasy, internal struggles, and high-fashion aesthetics.</p>
      `,
      music: `
        <h2>02. DISCOGRAPHY</h2>
        <ul style="list-style: none; line-height: 2;">
          <li>✨ <strong>MITO</strong> (Mood Swings In This Order)</li>
          <li>✨ <strong>MIITO</strong> (Mood Swings In To Order)</li>
          <li>✨ <strong>Dear Insanity...</strong></li>
        </ul>
      `,
      videos: `
        <h2>03. VISUAL WORKS</h2>
        <p>DPR IAN has directed and edited iconic music videos not only for himself but for various prominent artists in the industry.</p>
        <p style="margin-top: 15px;">Key Directorials: <em>'Don't Go Insane', 'Nerves', 'Ballroom Extravaganza'</em>.</p>
      `,
      contact: `
        <h2>04. CONTACT & EXHIBITION</h2>
        <p>For inquiries regarding visual direction, licensing, or art exhibitions:</p>
        <p style="margin-top: 15px; color: var(--gold-main);"><strong>Email:</strong> contact@dreamperfectregime.com</p>
      `
    };

    function openModal(key) {
      const modal = document.getElementById('modalOverlay');
      const container = document.getElementById('modalContent');
      container.innerHTML = contentData[key];
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    // Close modal on background click
    window.onclick = function(event) {
      const modal = document.getElementById('modalOverlay');
      if (event.target === modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
