<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPR IAN — Minimal Futurism</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    /* === PALETTE & MINIMAL FUTURISM VARIABLES === */
    :root {
      --bg-void: #0E0D10;
      --bg-card: rgba(22, 20, 25, 0.7);
      --red-crimson: #8C2226;
      --red-deep: #4A1417;
      --grey-light: #D8D8E0;
      --grey-mid: #8E8D94;
      --grey-dark: #333238;
      --border-accent: rgba(140, 34, 38, 0.4);
      --glow-red: rgba(140, 34, 38, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-void);
      color: var(--grey-light);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* === BACKGROUND MESH / FUTURISTIC GRID === */
    .bg-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(140, 34, 38, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(140, 34, 38, 0.05) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 1;
      pointer-events: none;
    }

    .bg-gradient {
      position: absolute;
      top: 50%;
      left: 30%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--red-deep) 0%, transparent 70%);
      filter: blur(80px);
      opacity: 0.5;
      z-index: 1;
      pointer-events: none;
    }

    /* === HERO SECTION === */
    .hero {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding-left: 10vw;
    }

    .meta-tag {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 4px;
      color: var(--red-crimson);
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .meta-tag::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--red-crimson);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--red-crimson);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 6rem;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 0.95;
      color: var(--grey-light);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 span {
      color: var(--grey-dark);
      font-weight: 300;
      transition: color 0.5s ease;
    }

    .hero:hover h1 span {
      color: var(--red-crimson);
    }

    p.subtitle {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 2px;
      color: var(--grey-mid);
      max-width: 480px;
      line-height: 1.6;
    }

    .hint-text {
      position: absolute;
      bottom: 40px;
      left: 10vw;
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: var(--grey-dark);
      text-transform: uppercase;
      font-family: 'Space Grotesk', sans-serif;
    }

    /* === HOVER TRIGGER ZONE (RIGHT EDGE) === */
    .hover-trigger-zone {
      position: fixed;
      right: 0;
      top: 0;
      width: 100px;
      height: 100vh;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .hover-trigger-zone::after {
      content: '';
      position: absolute;
      right: 0;
      top: 30%;
      height: 40%;
      width: 2px;
      background: linear-gradient(to bottom, transparent, var(--red-crimson), transparent);
      opacity: 0.6;
      transition: opacity 0.3s;
    }

    .hover-trigger-zone:hover::after {
      opacity: 1;
    }

    /* === MINIMAL FUTURISM SIDE MENU === */
    .side-menu {
      position: fixed;
      right: -120px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 24px;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 101;
      padding: 10px;
    }

    .hover-trigger-zone:hover .side-menu,
    .side-menu:hover {
      right: 35px;
    }

    /* Sleek Circular Nodes */
    .menu-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--bg-void);
      border: 1px solid var(--grey-dark);
      color: var(--grey-mid);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .menu-btn::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      padding: 1px;
      background: linear-gradient(135deg, var(--red-crimson), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .menu-btn:hover {
      color: var(--grey-light);
      border-color: var(--red-crimson);
      transform: scale(1.15);
      box-shadow: 0 0 20px var(--glow-red);
    }

    .menu-btn:hover::before {
      opacity: 1;
    }

    /* === MINI-PAGE MODAL (MINIMAL OVERLAY) === */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(14, 13, 16, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-card {
      background: var(--bg-card);
      width: 70%;
      max-width: 800px;
      height: 60vh;
      border: 1px solid rgba(216, 216, 224, 0.1);
      border-left: 2px solid var(--red-crimson);
      padding: 50px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 40px var(--glow-red);
      animation: modalSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .close-btn {
      position: absolute;
      top: 30px;
      right: 30px;
      background: none;
      border: 1px solid var(--grey-dark);
      color: var(--grey-mid);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      font-family: 'Space Grotesk', sans-serif;
    }

    .close-btn:hover {
      border-color: var(--red-crimson);
      color: var(--grey-light);
      transform: rotate(90deg);
    }

    .modal-body {
      height: 100%;
      overflow-y: auto;
      padding-right: 15px;
    }

    .modal-body h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--grey-light);
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .modal-body h2::before {
      content: '//';
      font-size: 0.9rem;
      color: var(--red-crimson);
      font-weight: 400;
    }

    .modal-body p {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--grey-mid);
      font-weight: 300;
      margin-bottom: 15px;
    }

    .data-list {
      list-style: none;
      margin-top: 15px;
    }

    .data-list li {
      padding: 12px 0;
      border-bottom: 1px solid rgba(216, 216, 224, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--grey-mid);
      font-size: 0.95rem;
    }

    .data-list li span.val {
      color: var(--red-crimson);
      font-family: 'Space Grotesk', sans-serif;
    }

    @keyframes modalSlide {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-gradient"></div>

  <!-- Hero Section -->
  <section class="hero">
    <div class="meta-tag">ARCHIVE // VISUAL IDENTITY</div>
    <h1>DPR IAN<span>.</span></h1>
    <p class="subtitle">Exploring the dichotomy of shadow and sanity through cinematic soundscapes and high-contrast visual direction.</p>
    <div class="hint-text">[ MOVE CURSOR TO RIGHT EDGE ]</div>
  </section>

  <!-- Hover Trigger Area & Side Menu -->
  <div class="hover-trigger-zone">
    <nav class="side-menu">
      <button class="menu-btn" onclick="openModal('bio')">BIO</button>
      <button class="menu-btn" onclick="openModal('disc')">DISC</button>
      <button class="menu-btn" onclick="openModal('film')">FILM</button>
      <button class="menu-btn" onclick="openModal('info')">INFO</button>
    </nav>
  </div>

  <!-- Mini-Page Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <div class="modal-body" id="modalContent">
        <!-- Content dynamic injection -->
      </div>
    </div>
  </div>

  <script>
    const contentData = {
      bio: `
        <h2>BIOGRAPHY</h2>
        <p><strong>Christian Yu</strong>, known professionally as <strong>DPR IAN</strong>, is an Australian director, composer, and visual artist operating from Seoul.</p>
        <p>As chief visual director of the DPR collective, he pioneers a stark, narrative-driven aesthetic where psychological themes converge with dark ambient pop and cinematic surrealism.</p>
      `,
      disc: `
        <h2>DISCOGRAPHY</h2>
        <ul class="data-list">
          <li><span>MITO — Mood Swings In This Order</span> <span class="val">[2021]</span></li>
          <li><span>MIITO — Mood Swings In To Order</span> <span class="val">[2022]</span></li>
          <li><span>Dear Insanity...</span> <span class="val">[2023]</span></li>
          <li><span>SAINT</span> <span class="val">[2024]</span></li>
        </ul>
      `,
      film: `
        <h2>VISUAL WORKS</h2>
        <p>Directorial and post-production portfolio focusing on high-concept narrative structures, color discipline, and dynamic editing.</p>
        <ul class="data-list">
          <li><span>Don't Go Insane</span> <span class="val">DIRECTOR</span></li>
          <li><span>Ballroom Extravaganza</span> <span class="val">DIRECTOR</span></li>
          <li><span>Nerves</span> <span class="val">DIRECTOR</span></li>
          <li><span>So Beautiful</span> <span class="val">DIRECTOR</span></li>
        </ul>
      `,
      info: `
        <h2>CONTACT & INQUIRIES</h2>
        <p>For visual direction, soundtrack scoring, and global exhibition projects:</p>
        <ul class="data-list" style="margin-top:20px;">
          <li><span>REPRESENTATION</span> <span class="val">DPR STUDIO</span></li>
          <li><span>EMAIL</span> <span class="val">contact@dreamperfectregime.com</span></li>
          <li><span>LOCATION</span> <span class="val">SEOUL / SYDNEY</span></li>
        </ul>
      `
    };

    function openModal(key) {
      const modal = document.getElementById('modalOverlay');
      const container = document.getElementById('modalContent');
      container.innerHTML = contentData[key];
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('modalOverlay');
      if (event.target === modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
