<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repository Hub — Main Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    /* === PALETTE & MINIMAL FUTURISM VARIABLES === */
    :root {
      --bg-void: #0E0D10;
      --bg-card: rgba(22, 20, 25, 0.85);
      --red-crimson: #8C2226;
      --red-deep: #4A1417;
      --grey-light: #D8D8E0;
      --grey-mid: #8E8D94;
      --grey-dark: #333238;
      --border-accent: rgba(140, 34, 38, 0.4);
      --glow-red: rgba(140, 34, 38, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-void);
      color: var(--grey-light);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* === BACKGROUND MESH / FUTURISTIC GRID === */
    .bg-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(140, 34, 38, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(140, 34, 38, 0.05) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 1;
      pointer-events: none;
    }

    .bg-gradient {
      position: absolute;
      top: 50%;
      left: 30%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--red-deep) 0%, transparent 70%);
      filter: blur(80px);
      opacity: 0.5;
      z-index: 1;
      pointer-events: none;
    }

    /* === HERO SECTION === */
    .hero {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding-left: 10vw;
    }

    .meta-tag {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 4px;
      color: var(--red-crimson);
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .meta-tag::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--red-crimson);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--red-crimson);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 5.5rem;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 0.95;
      color: var(--grey-light);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 span {
      color: var(--grey-dark);
      font-weight: 300;
      transition: color 0.5s ease;
    }

    .hero:hover h1 span {
      color: var(--red-crimson);
    }

    p.subtitle {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 2px;
      color: var(--grey-mid);
      max-width: 520px;
      line-height: 1.6;
    }

    .hint-text {
      position: absolute;
      bottom: 40px;
      left: 10vw;
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: var(--grey-dark);
      text-transform: uppercase;
      font-family: 'Space Grotesk', sans-serif;
    }

    /* === HOVER TRIGGER ZONE (RIGHT EDGE) === */
    .hover-trigger-zone {
      position: fixed;
      right: 0;
      top: 0;
      width: 100px;
      height: 100vh;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .hover-trigger-zone::after {
      content: '';
      position: absolute;
      right: 0;
      top: 30%;
      height: 40%;
      width: 2px;
      background: linear-gradient(to bottom, transparent, var(--red-crimson), transparent);
      opacity: 0.6;
      transition: opacity 0.3s;
    }

    .hover-trigger-zone:hover::after {
      opacity: 1;
    }

    /* === MINIMAL FUTURISM SIDE MENU === */
    .side-menu {
      position: fixed;
      right: -140px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 101;
      padding: 10px;
    }

    .hover-trigger-zone:hover .side-menu,
    .side-menu:hover {
      right: 35px;
    }

    /* Sleek Circular Nodes */
    .menu-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--bg-void);
      border: 1px solid var(--grey-dark);
      color: var(--grey-mid);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      padding: 5px;
    }

    .menu-btn::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      padding: 1px;
      background: linear-gradient(135deg, var(--red-crimson), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .menu-btn:hover {
      color: var(--grey-light);
      border-color: var(--red-crimson);
      transform: scale(1.15);
      box-shadow: 0 0 20px var(--glow-red);
    }

    .menu-btn:hover::before {
      opacity: 1;
    }

    /* === FULLSCREEN MODAL FOR EMBEDDED PAGES === */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(14, 13, 16, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-card {
      background: var(--bg-card);
      width: 85%;
      max-width: 1200px;
      height: 80vh;
      border: 1px solid rgba(216, 216, 224, 0.1);
      border-left: 2px solid var(--red-crimson);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 40px var(--glow-red);
      animation: modalSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
      border-radius: 8px;
    }

    .modal-header {
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(216, 216, 224, 0.1);
      background: rgba(14, 13, 16, 0.5);
    }

    .modal-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      letter-spacing: 2px;
      color: var(--grey-light);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-title::before {
      content: '//';
      color: var(--red-crimson);
    }

    .close-btn {
      background: none;
      border: 1px solid var(--grey-dark);
      color: var(--grey-mid);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      font-family: 'Space Grotesk', sans-serif;
    }

    .close-btn:hover {
      border-color: var(--red-crimson);
      color: var(--grey-light);
      transform: rotate(90deg);
    }

    .modal-body {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff; /* Белый фон для загружаемых сайтов */
    }

    @keyframes modalSlide {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-gradient"></div>

  <!-- Hero Section -->
  <section class="hero">
    <div class="meta-tag">PORTFOLIO // REPOSITORY HUB</div>
    <h1>MAIN PAGE<span>.</span></h1>
    <p class="subtitle">Central navigation hub for repository projects and interactive web applications.</p>
    <div class="hint-text">[ MOVE CURSOR TO RIGHT EDGE TO OPEN DIRECTORY ]</div>
  </section>

  <!-- Hover Trigger Area & Side Menu -->
  <div class="hover-trigger-zone">
    <nav class="side-menu">
      <button class="menu-btn" onclick="openPage('Gallery/index.html', 'GALLERY')">GALLERY</button>
      <button class="menu-btn" onclick="openPage('site%20-%20template/index.html', 'TEMPLATE')">TEMPLATE</button>
      <button class="menu-btn" onclick="openPage('starter-shop/index.html', 'SHOP')">SHOP</button>
      <button class="menu-btn" onclick="openPage('README.md', 'README')">README</button>
    </nav>
  </div>

  <!-- Mini-Page Modal (Iframe Container) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">PROJECT VIEW</span>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <iframe id="pageFrame" src=""></iframe>
      </div>
    </div>
  </div>

  <script>
    function openPage(url, title) {
      const modal = document.getElementById('modalOverlay');
      const frame = document.getElementById('pageFrame');
      const titleElement = document.getElementById('modalTitle');
      
      titleElement.innerText = 'PROJECT // ' + title;
      frame.src = url;
      modal.style.display = 'flex';
    }

    function closeModal() {
      const modal = document.getElementById('modalOverlay');
      const frame = document.getElementById('pageFrame');
      
      modal.style.display = 'none';
      frame.src = ''; // Очищаем iframe при закрытии
    }

    window.onclick = function(event) {
      const modal = document.getElementById('modalOverlay');
      if (event.target === modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
