<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPR IAN // Y2K GLASS EXPERIENTIAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=VT323&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    /* === RESET & Y2K GLASS VARIABLES === */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    :root {
      --bg-color: #06050b;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.2);
      --neon-cyan: #00f3ff;
      --neon-pink: #ff00a0;
      --glass-shadow: 0 8px 32px 0 rgba(0, 243, 255, 0.25);
    }

    body {
      background-color: var(--bg-color);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }

    /* === CANVAS BACKDROP (FALLING DROPS) === */
    #dropCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* === HERO SECTION (GLASSMorphism) === */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* Glass Card Center */
    .hero-glass-card {
      background: rgba(20, 15, 35, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      border-left: 1px solid rgba(255, 255, 255, 0.5);
      padding: 50px 70px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, var(--neon-cyan) 50%, var(--neon-pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-bottom: 5px;
      filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.4));
    }

    p.subtitle {
      font-family: 'VT323', monospace;
      font-size: 2rem;
      letter-spacing: 3px;
      color: var(--neon-cyan);
      text-transform: uppercase;
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    /* === HOVER TRIGGER ZONE (RIGHT EDGE) === */
    .hover-trigger-zone {
      position: fixed;
      right: 0;
      top: 0;
      width: 100px;
      height: 100vh;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    /* === Y2K GLASS MENU === */
    .side-menu {
      position: fixed;
      right: -130px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 101;
      padding: 10px;
    }

    .hover-trigger-zone:hover .side-menu,
    .side-menu:hover {
      right: 25px;
    }

    /* Glass Orb Buttons */
    .menu-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 0, 160, 0.3) 0%, rgba(0, 243, 255, 0.2) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-top: 2px solid rgba(255, 255, 255, 0.8);
      color: #ffffff;
      font-family: 'VT323', monospace;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      text-transform: uppercase;
    }

    .menu-btn:hover {
      transform: scale(1.2);
      background: linear-gradient(135deg, rgba(255, 0, 160, 0.6) 0%, rgba(0, 243, 255, 0.5) 100%);
      border-color: #ffffff;
      box-shadow: 0 0 25px var(--neon-cyan), inset 0 0 15px #ffffff;
    }

    /* === MINI-PAGE MODAL (GLASS POP-UP) === */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 5, 12, 0.6);
      backdrop-filter: blur(15px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-card {
      background: rgba(18, 15, 30, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      width: 75%;
      max-width: 800px;
      height: 65vh;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-top: 2px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 243, 255, 0.2);
      border-radius: 24px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: popUp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-header {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-title {
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      color: var(--neon-cyan);
      letter-spacing: 2px;
    }

    .close-btn {
      background: rgba(255, 0, 160, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .close-btn:hover {
      background: var(--neon-pink);
      box-shadow: 0 0 10px var(--neon-pink);
      transform: scale(1.1);
    }

    .modal-body {
      padding: 35px;
      font-family: 'VT323', monospace;
      font-size: 1.5rem;
      line-height: 1.6;
      color: #e0e0e0;
      overflow-y: auto;
    }

    .modal-body h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      color: #ffffff;
      margin-bottom: 15px;
      text-shadow: 0 0 10px var(--neon-pink);
    }

    @keyframes popUp {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <canvas id="dropCanvas"></canvas>

  <section class="hero">
    <div class="hero-glass-card">
      <h1>DPR IAN</h1>
      <p class="subtitle">&lt;VISUAL_DIRECTOR_&amp;_ARTIST&gt;</p>
      <p style="margin-top: 20px; font-family: 'VT323', monospace; color: rgba(255, 255, 255, 0.6); font-size: 1.2rem;">
        [ HOVER RIGHT EDGE TO OPEN MENU ]
      </p>
    </div>
  </section>

  <div class="hover-trigger-zone">
    <nav class="side-menu">
      <button class="menu-btn" onclick="openModal('bio')">BIO</button>
      <button class="menu-btn" onclick="openModal('audio')">AUDIO</button>
      <button class="menu-btn" onclick="openModal('films')">FILMS</button>
      <button class="menu-btn" onclick="openModal('info')">INFO</button>
    </nav>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">// DPR_IAN_WORLD.GLASS</span>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalContent">
        </div>
    </div>
  </div>

  <script>
    /* === FALLING LIQUID DROPS CANVAS ANIMATION === */
    const canvas = document.getElementById('dropCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const drops = [];
    const dropCount = 45;

    class LiquidDrop {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.speed = Math.random() * 3 + 2;
        this.length = Math.random() * 25 + 10;
        this.radius = Math.random() * 3 + 2;
        this.color = Math.random() > 0.5 ? 'rgba(0, 243, 255, ' : 'rgba(255, 0, 160, ';
        this.opacity = Math.random() * 0.5 + 0.3;
      }

      update() {
        this.y += this.speed;
        if (this.y > canvas.height) {
          this.reset();
        }
      }

      draw() {
        ctx.beginPath();
        // Draw drop body
        ctx.fillStyle = this.color + this.opacity + ')';
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Draw tail
        ctx.beginPath();
        ctx.strokeStyle = this.color + (this.opacity * 0.5) + ')';
        ctx.lineWidth = this.radius * 0.8;
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x, this.y - this.length);
        ctx.stroke();
      }
    }

    for (let i = 0; i < dropCount; i++) {
      drops.push(new LiquidDrop());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drops.forEach(drop => {
        drop.update();
        drop.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();

    /* === MODAL CONTENT DATA === */
    const contentData = {
      bio: `
        <h2>// BIOGRAPHY</h2>
        <p>Christian Yu, professionally known as <strong>DPR IAN</strong>, is an Australian-born singer, director, and chief editor based in Seoul.</p>
        <p style="margin-top: 15px; color: var(--neon-pink);">
          Blending Y2K surrealism, mental health metaphors, and futuristic glass aesthetics into his audiovisual masterpieces.
        </p>
      `,
      audio: `
        <h2>// DISCOGRAPHY</h2>
        <p>STREAMING ARCHIVES:</p>
        <ul style="list-style: '◈ '; margin-left: 20px; margin-top: 10px; color: var(--neon-cyan);">
          <li>MITO (Mood Swings In This Order)</li>
          <li>MIITO (Mood Swings In To Order)</li>
          <li>Dear Insanity...</li>
        </ul>
      `,
      films: `
        <h2>// VISUAL DIRECTING</h2>
        <p>DPR IAN directs, edits, and stars in his high-concept cinematic music videos.</p>
        <p style="margin-top: 10px; color: var(--neon-cyan);">
          FEATURED MV: 'Don't Go Insane', 'So Beautiful', 'Nerves', 'Ballroom Extravaganza'.
        </p>
      `,
      info: `
        <h2>// CONTACT & NETWORK</h2>
        <p>DREAM PERFECT REGIME (DPR) STUDIO</p>
        <p style="margin-top: 15px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; border: 1px solid var(--neon-cyan);">
          EMAIL: contact@dreamperfectregime.com<br>
          LOCATION: SEOUL, SOUTH KOREA
        </p>
      `
    };

    function openModal(key) {
      const modal = document.getElementById('modalOverlay');
      const container = document.getElementById('modalContent');
      container.innerHTML = contentData[key];
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('modalOverlay');
      if (event.target === modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
