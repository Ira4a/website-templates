<html lang="en">

  <style>
    /* === RESET & Y2K GLASS VARIABLES === */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    :root {
      --bg-color: #06050b;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.2);
      --neon-cyan: #00f3ff;
      --neon-pink: #ff00a0;
      --glass-shadow: 0 8px 32px 0 rgba(0, 243, 255, 0.25);
    }

    body {
      background-color: var(--bg-color);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }

    /* === CANVAS BACKDROP (FALLING DROPS) === */
    #dropCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* === HERO SECTION (GLASSMorphism) === */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* Glass Card Center */
    .hero-glass-card {
      background: rgba(20, 15, 35, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      border-left: 1px solid rgba(255, 255, 255, 0.5);
      padding: 50px 70px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, var(--neon-cyan) 50%, var(--neon-pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-bottom: 5px;
      filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.4));
    }

    p.subtitle {
      font-family: 'VT323', monospace;
      font-size: 2rem;
      letter-spacing: 3px;
      color: var(--neon-cyan);
      text-transform: uppercase;
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    /* === HOVER TRIGGER ZONE (RIGHT EDGE) === */
    .hover-trigger-zone {
      position: fixed;
      right: 0;
      top: 0;
      width: 100px;
      height: 100vh;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    /* === Y2K GLASS MENU === */
    .side-menu {
      position: fixed;
      right: -130px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 101;
      padding: 10px;
    }

    .hover-trigger-zone:hover .side-menu,
    .side-menu:hover {
      right: 25px;
    }

    /* Glass Orb Buttons */
    .menu-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 0, 160, 0.3) 0%, rgba(0, 243, 255, 0.2) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-top: 2px solid rgba(255, 255, 255, 0.8);
      color: #ffffff;
      font-family: 'VT323', monospace;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      text-transform: uppercase;
    }

    .menu-btn:hover {
      transform: scale(1.2);
      background: linear-gradient(135deg, rgba(255, 0, 160, 0.6) 0%, rgba(0, 243, 255, 0.5) 100%);
      border-color: #ffffff;
      box-shadow: 0 0 25px var(--neon-cyan), inset 0 0 15px #ffffff;
    }
