<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPR IAN // Y2K ARCHIVE</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=VT323&display=swap" rel="stylesheet">
  
  <style>
    /* === RESET & Y2K VARIABLES === */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    :root {
      --bg-color: #080810;
      --panel-bg: rgba(20, 20, 35, 0.85);
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --silver: #e0e0e0;
      --text-main: #ffffff;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Orbitron', sans-serif;
      overflow-x: hidden;
      height: 100vh;
      /* Scanlines effect */
      background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
    }

    /* === HERO SECTION (Retro Cyber vibe) === */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      border: 4px solid var(--neon-cyan);
      box-shadow: inset 0 0 15px var(--neon-cyan);
    }

    /* Cyber Glitch Title */
    h1 {
      font-size: 4.5rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--text-main);
      text-shadow: 3px 3px 0px var(--neon-pink), -3px -3px 0px var(--neon-cyan);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    p.subtitle {
      font-family: 'VT323', monospace;
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      text-transform: uppercase;
    }

    .badge {
      margin-top: 15px;
      background: var(--neon-pink);
      color: #000;
      padding: 4px 12px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 20px;
      box-shadow: 0 0 10px var(--neon-pink);
    }

    /* === HOVER TRIGGER ZONE (RIGHT EDGE) === */
    .hover-trigger-zone {
      position: fixed;
      right: 0;
      top: 0;
      width: 90px;
      height: 100vh;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    /* === Y2K ROUNDED MENU === */
    .side-menu {
      position: fixed;
      right: -120px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 25px;
      transition: right 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 101;
      padding: 10px;
    }

    /* Reveal menu on hover */
    .hover-trigger-zone:hover .side-menu,
    .side-menu:hover {
      right: 25px;
    }

    /* Y2K Bubble / Orb Buttons */
    .menu-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff007f 0%, #7928ca 50%, #00f3ff 100%);
      border: 3px solid #ffffff;
      color: #ffffff;
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.6), inset 0 0 8px #ffffff;
      transition: all 0.2s ease-in-out;
      display: flex;
      justify-content: center;
      align-items: center;
      text-transform: uppercase;
    }

    .menu-btn:hover {
      transform: scale(1.25) rotate(-10deg);
      box-shadow: 0 0 25px var(--neon-pink), inset 0 0 12px #ffffff;
      border-color: var(--neon-cyan);
    }

    /* === MINI-PAGE MODAL (Y2K WINDOW) === */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 5, 10, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-card {
      background: var(--panel-bg);
      width: 75%;
      max-width: 750px;
      height: 65vh;
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 30px var(--neon-cyan), inset 0 0 15px rgba(0, 243, 255, 0.3);
      border-radius: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Y2K Window Titlebar */
    .modal-header {
      background: linear-gradient(90deg, var(--neon-pink), #7928ca);
      padding: 8px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--neon-cyan);
    }

    .modal-title {
      font-family: 'VT323', monospace;
      font-size: 1.3rem;
      color: #fff;
      letter-spacing: 1px;
    }

    .close-btn {
      background: #ff0055;
      border: 2px solid #fff;
      color: #fff;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    .close-btn:hover {
      background: #fff;
      color: #000;
    }

    .modal-body {
      padding: 30px;
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      line-height: 1.6;
      color: var(--silver);
      overflow-y: auto;
    }

    .modal-body h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      color: var(--neon-cyan);
      margin-bottom: 15px;
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    @keyframes popUp {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Main Hero Section -->
  <section class="hero">
    <h1>DPR IAN</h1>
    <p class="subtitle">&lt;VISUAL_DIRECTOR_&amp;_MUSICIAN&gt;</p>
    <div class="badge">SYSTEM V2.000 // READY</div>
    <p style="margin-top: 30px; font-family: 'VT323', monospace; color: #666; font-size: 1.2rem;">
      [ HOVER RIGHT EDGE TO UNLOCK MENU ]
    </p>
  </section>

  <!-- Trigger Zone & Side Menu -->
  <div class="hover-trigger-zone">
    <nav class="side-menu">
      <button class="menu-btn" onclick="openModal('bio')">BIO</button>
      <button class="menu-btn" onclick="openModal('audio')">AUDIO</button>
      <button class="menu-btn" onclick="openModal('clips')">CLIPS</button>
      <button class="menu-btn" onclick="openModal('logs')">LOGS</button>
    </nav>
  </div>

  <!-- Y2K Pop-up Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">C:\DPR_IAN\SYSTEM_FILE.EXE</span>
        <button class="close-btn" onclick="closeModal()">X</button>
      </div>
      <div class="modal-body" id="modalContent">
        <!-- Dynamic Content -->
      </div>
    </div>
  </div>

  <script>
    const contentData = {
      bio: `
        <h2>// PROFILE_DATA</h2>
        <p><strong>NAME:</strong> Christian Yu (DPR IAN)</p>
        <p><strong>ROLE:</strong> Co-founder, Visual Director, Musician at Dream Perfect Regime (DPR).</p>
        <p style="margin-top: 15px; color: var(--neon-pink);">
          Creating dark, surreal visual experiences blending 2000s cyber aesthetics, raw emotion, and high-concept cinema.
        </p>
      `,
      audio: `
        <h2>// AUDIO_DISKETTES</h2>
        <p>SELECT ALBUM TO PLAY:</p>
        <ul style="list-style: ' > '; margin-left: 20px; margin-top: 10px;">
          <li>MITO (Mood Swings In This Order)</li>
          <li>MIITO (Mood Swings In To Order)</li>
          <li>Dear Insanity...</li>
        </ul>
      `,
      clips: `
        <h2>// VIDEO_ARCHIVE</h2>
        <p>DIRECTED & EDITED BY DPR IAN:</p>
        <p style="color: var(--neon-cyan); margin-top: 10px;">
          > Don't Go Insane<br>
          > Ballroom Extravaganza<br>
          > So Beautiful
        </p>
      `,
      logs: `
        <h2>// SYSTEM_CONTACT</h2>
        <p>TRANSMIT SIGNAL TO DPR:</p>
        <p style="margin-top: 10px; background: #000; padding: 10px; border: 1px dashed var(--neon-cyan);">
          MAIL: contact@dreamperfectregime.com<br>
          STATUS: ONLINE
        </p>
      `
    };

    function openModal(key) {
      const modal = document.getElementById('modalOverlay');
      const container = document.getElementById('modalContent');
      container.innerHTML = contentData[key];
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('modalOverlay');
      if (event.target === modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
